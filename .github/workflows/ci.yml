name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # tsc runs as part of build, so this covers the type check against the
      # generated API declarations in src/types/api.d.ts as well.
      - name: Typecheck and build
        run: npm run build
